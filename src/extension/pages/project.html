<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PageToLLM Canvas - Project</title>
    <link rel="stylesheet" href="chat.css" />
    <style>
      /* Same token approach as options.html: `light-dark()` declares each token
         once; `data-theme` only flips color-scheme. */
      :root {
        color-scheme: light dark;
        --ink: light-dark(#000000, #f4f5f7);
        --surface: light-dark(#ffffff, #1b1d22);
        --surface-low: light-dark(#f2f3f5, #141519);
        --surface-highest: light-dark(#e4e7eb, #24272e);
        --on-surface: light-dark(#141414, #ececec);
        --on-surface-muted: light-dark(#5f646b, #a0a6af);
        --accent: light-dark(#3a404d, #aab2c0);
        --ghost: light-dark(rgba(0, 0, 0, 0.2), rgba(255, 255, 255, 0.22));
        --font-voice: georgia, 'Times New Roman', times, serif;
        --font-data:
          -apple-system, blinkmacsystemfont, 'Segoe UI', roboto, oxygen, ubuntu, cantarell,
          'Helvetica Neue', helvetica, arial, sans-serif;
      }

      :root[data-theme='light'] {
        color-scheme: light;
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
      }

      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--font-data);
        margin: 0;
        background: var(--surface-low);
        color: var(--on-surface);
        overflow: hidden;
      }
      #project-root {
        height: 100%;
      }
      h1,
      h2 {
        font-family: var(--font-voice);
        margin: 0;
      }
      button {
        padding: 6px 12px;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      button:hover:not(:disabled) {
        background: var(--ink);
        color: var(--surface);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button[aria-pressed='true'] {
        background: var(--ink);
        color: var(--surface);
      }
      .note {
        color: var(--on-surface-muted);
        font-size: 13px;
        margin: 0;
      }
      .status {
        display: inline-block;
        padding: 2px 8px;
        border: 1px solid var(--ink);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: var(--surface);
        color: var(--on-surface-muted);
      }
      .status.done {
        background: var(--ink);
        color: var(--surface);
      }

      /* Page states */
      .project-loading {
        padding: 32px;
      }
      .project-state {
        max-width: 520px;
        margin: 15vh auto 0;
        padding: 24px;
        border: 2px solid var(--ink);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }
      .project-state h1 {
        font-size: 26px;
      }

      /* Layout */
      .project-shell {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .project-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        background: var(--surface);
        border-bottom: 2px solid var(--ink);
      }
      .project-header h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .project-header-spacer {
        flex: 1;
      }
      .project-meta {
        color: var(--on-surface-muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .color-chip {
        flex: none;
        width: 14px;
        height: 14px;
        border: 1px solid var(--ink);
      }
      .project-body {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .project-canvas-wrap {
        flex: 1;
        min-width: 0;
        position: relative;
      }

      /* Canvas */
      .canvas-area {
        position: absolute;
        inset: 0;
      }
      .canvas-surface {
        position: absolute;
        inset: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        user-select: none;
        background-image: radial-gradient(var(--ghost) 1px, transparent 1px);
      }
      .canvas-surface:active {
        cursor: grabbing;
      }
      .canvas-layer {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
      }
      .canvas-node {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        align-items: flex-start;
      }
      .canvas-controls {
        position: absolute;
        right: 16px;
        bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px;
        background: var(--surface);
        border: 2px solid var(--ink);
      }
      .canvas-zoom-level {
        min-width: 44px;
        text-align: center;
        font-size: 12px;
        font-weight: 800;
      }
      .canvas-hint {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin: 0;
        padding: 14px 20px;
        background: var(--surface);
        border: 2px solid var(--ink);
        font-family: var(--font-voice);
        font-size: 16px;
        pointer-events: none;
      }

      /* Tab card */
      .tab-card {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--ink);
        cursor: default;
      }
      .tab-card.is-active {
        border-width: 3px;
        box-shadow: 4px 4px 0 var(--ink);
      }
      .tab-card-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--ghost);
        background: var(--surface-highest);
        cursor: move;
      }
      .tab-card-favicon {
        flex: none;
        width: 24px;
        height: 24px;
        object-fit: contain;
      }
      .tab-card-favicon-fallback {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        border: 1px solid var(--ink);
        background: var(--surface);
        font-family: var(--font-voice);
        font-weight: 700;
        font-size: 13px;
      }
      .tab-card-heading {
        flex: 1;
        min-width: 0;
      }
      .tab-card-title {
        font-size: 14px;
        line-height: 1.25;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
      }
      .tab-card-host {
        margin: 2px 0 0;
        color: var(--on-surface-muted);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tab-card-loading {
        flex: none;
        width: 12px;
        height: 12px;
        border: 2px solid var(--ghost);
        border-top-color: var(--ink);
        border-radius: 50%;
        animation: tab-card-spin 0.8s linear infinite;
      }
      @keyframes tab-card-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .tab-card-body {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 10px 12px;
        padding: 8px;
        border: 1px dashed var(--ghost);
        color: var(--on-surface-muted);
        font-size: 12px;
        text-align: center;
      }
      .tab-card-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        padding: 0 12px 10px;
      }
      .tab-card-error {
        color: var(--on-surface-muted);
        font-size: 11px;
      }

      /* Per-page chat drawer, unfolded beside its tab card */
      .page-chat-drawer {
        box-sizing: border-box;
        width: 380px;
        height: 460px;
        display: flex;
        flex-direction: column;
        margin-left: -1px;
        background: var(--surface);
        border: 1px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        cursor: default;
        user-select: text;
      }
      .page-chat-header {
        flex: none;
        padding: 6px 12px;
        border-bottom: 1px solid var(--ghost);
        background: var(--surface-highest);
      }
      .page-chat-label {
        color: var(--on-surface-muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .page-chat-body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .page-chat-note {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 16px;
      }
      .page-chat-fold {
        flex: none;
        margin-top: 12px;
        margin-left: -1px;
        padding: 10px 4px;
        writing-mode: vertical-rl;
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      .page-chat-fold[aria-expanded='true'] {
        background: var(--ink);
        color: var(--surface);
      }

      /* Global chat stub */
      .chat-panel {
        flex: none;
        width: 320px;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-left: 2px solid var(--ink);
      }
      .chat-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--ghost);
      }
      .chat-panel-header h2 {
        font-size: 16px;
      }
      .chat-panel-body {
        flex: 1;
        padding: 16px;
      }
      .chat-panel-composer {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px 16px;
        border-top: 1px solid var(--ghost);
      }
      .chat-panel-composer textarea {
        resize: none;
        padding: 8px;
        border: 1px solid var(--ghost);
        border-radius: 0;
        background: var(--surface-low);
        color: var(--on-surface);
        font: inherit;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="project-root"></div>
    <script src="project.js"></script>
  </body>
</html>
