<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PageToLLM Canvas</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <h1>PageToLLM Canvas</h1>
          <div class="host" id="active-host">Loading page...</div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="theme-btn" type="button" title="Theme" aria-label="Theme">
            ◐
          </button>
          <button
            class="icon-btn"
            id="refresh-btn"
            type="button"
            title="Reload saved analyses for the current page."
            aria-label="Reload saved analyses for the current page"
          >
            ↻
          </button>
        </div>
      </header>

      <button
        class="primary"
        id="pick-btn"
        type="button"
        title="Select blocks on this page and send them to your active LLM provider for analysis."
        aria-describedby="pick-hint"
      >
        Pick Blocks
      </button>
      <div class="control-hint" id="pick-hint">
        Select page sections to analyze and save as a canvas.
      </div>

      <div class="section-title">
        <span>Saved analyses</span>
        <span id="record-count"></span>
      </div>
      <ul class="records" id="records"></ul>
      <div class="empty" id="empty" hidden>No saved analyses for this page yet.</div>
      <div class="error" id="error" hidden></div>

      <footer class="footer">
        <div class="footer-actions">
          <div class="footer-action">
            <button
              class="link-button"
              id="open-options"
              type="button"
              title="Configure LLM providers and extension settings."
              aria-describedby="options-hint"
            >
              Open Options
            </button>
            <div class="footer-hint" id="options-hint">
              Configure providers and extension settings.
            </div>
          </div>
          <div class="footer-action">
            <button
              class="link-button"
              id="open-records"
              type="button"
              title="View all saved analyses."
              aria-describedby="records-hint"
            >
              Open Records
            </button>
            <div class="footer-hint" id="records-hint">View all saved analyses.</div>
          </div>
        </div>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
