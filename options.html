<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>PageToLLM Canvas - Options</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #000000;
        --accent: #3a404d;
        --surface: #ffffff;
        --surface-low: #f2f3f5;
        --surface-highest: #e4e7eb;
        --on-surface: #141414;
        --on-surface-muted: #5f646b;
        --ghost: rgba(0, 0, 0, 0.2);
        --pagetollm-highlight-base-color: #3a404d;
        --pagetollm-highlight-color: rgb(58 64 77 / 0.12);
        --pagetollm-highlight-hover-color: rgb(58 64 77 / 0.08);
        --font-voice: 'Newsreader', Georgia, 'Times New Roman', serif;
        --font-data: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* Dark palette. Applied when `data-theme="dark"` is set, or when no
         explicit preference is set ("system") and the OS prefers dark. */
      :root[data-theme='dark'] {
        color-scheme: dark;
        --ink: #f4f5f7;
        --accent: #aab2c0;
        --surface: #1b1d22;
        --surface-low: #141519;
        --surface-highest: #24272e;
        --on-surface: #ececec;
        --on-surface-muted: #a0a6af;
        --ghost: rgba(255, 255, 255, 0.22);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']):not([data-theme='dark']) {
          color-scheme: dark;
          --ink: #f4f5f7;
          --accent: #aab2c0;
          --surface: #1b1d22;
          --surface-low: #141519;
          --surface-highest: #24272e;
          --on-surface: #ececec;
          --on-surface-muted: #a0a6af;
          --ghost: rgba(255, 255, 255, 0.22);
        }
      }
      body {
        font-family: var(--font-data);
        margin: 0;
        padding: 32px;
        background: var(--surface-low);
        color: var(--on-surface);
      }
      .options-shell {
        width: min(1180px, 100%);
        margin: 0 auto;
      }
      h1 {
        font-family: var(--font-voice);
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.05;
        margin: 0 0 20px 0;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      button {
        padding: 7px 14px;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      button:hover {
        background: var(--ink);
        color: var(--surface);
      }
      button.danger {
        background: var(--surface);
        color: var(--accent);
        border-color: var(--accent);
      }
      button.danger:hover {
        background: var(--accent);
        color: var(--surface);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border: 2px solid var(--ink);
      }
      th,
      td {
        padding: 11px 14px;
        text-align: left;
        border-bottom: 1px solid var(--ghost);
        font-size: 13px;
        vertical-align: top;
      }
      th {
        background: var(--surface-highest);
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border-bottom: 2px solid var(--ink);
      }
      tr:last-child td {
        border-bottom: none;
      }
      .url {
        max-width: 480px;
        word-break: break-all;
      }
      .record-url {
        word-break: break-all;
      }
      .record-url a {
        color: var(--ink);
        text-decoration: underline;
      }
      .record-url a:hover {
        color: var(--accent);
      }
      .record-snippet {
        margin-top: 6px;
        color: var(--on-surface-muted);
        font-size: 12px;
        line-height: 1.4;
        word-break: break-word;
      }
      .status {
        display: inline-block;
        padding: 2px 8px;
        border: 1px solid var(--ink);
        border-radius: 0;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: var(--surface);
        color: var(--on-surface-muted);
      }
      .status.done {
        background: var(--ink);
        color: var(--surface);
      }
      .status.error {
        background: var(--accent);
        color: var(--surface);
        border-color: var(--accent);
      }
      .status.pending,
      .status.splitting,
      .status.summarizing {
        background: var(--surface);
        color: var(--on-surface-muted);
        border-color: var(--ghost);
      }
      .empty {
        color: var(--on-surface-muted);
        font-style: italic;
        padding: 16px;
        text-align: center;
      }
      .note {
        font-size: 11px;
        color: var(--on-surface-muted);
        margin-top: 4px;
      }
      .note--stacked {
        margin-bottom: 12px;
      }
      .storage-total {
        margin-top: 10px;
        text-align: right;
      }
      .data-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-top: 24px;
      }
      .data-actions > div {
        padding: 18px;
        border: 1px solid var(--ghost);
        background: var(--surface-low);
      }
      .data-actions p {
        min-height: 3em;
        line-height: 1.5;
      }

      /* Foldable sections (native <details>/<summary>) */
      details.collapsible {
        margin: 0;
      }
      details.collapsible.section + details.collapsible.section {
        margin-top: 24px;
      }
      details.collapsible.field {
        margin-top: 16px;
      }
      .collapsible-summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .collapsible-summary::-webkit-details-marker {
        display: none;
      }
      .collapsible-summary::before {
        content: '▸';
        font-size: 11px;
        line-height: 1;
        color: var(--on-surface-muted);
        transition: transform 0.12s ease;
      }
      details.collapsible[open] > .collapsible-summary::before {
        transform: rotate(90deg);
      }
      .collapsible-summary:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .collapsible-summary .collapsible-title {
        margin: 0;
      }
      details.collapsible[open].section > .collapsible-body {
        margin-top: 14px;
      }
      details.collapsible[open].field > .collapsible-body {
        margin-top: 12px;
      }

      /* LLM Providers */
      .section {
        margin: 0;
      }
      h2 {
        font-family: var(--font-voice);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 14px 0;
      }
      h3 {
        margin: 0;
        font-size: 14px;
        line-height: 1.4;
      }
      .page-kicker {
        color: var(--on-surface-muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .options-tabs {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        overflow-x: auto;
        margin: 18px 0 24px;
        border-bottom: 2px solid var(--ink);
        background: var(--surface-low);
      }
      .options-tabs button {
        flex: 0 0 auto;
        padding: 11px 18px;
        border: 0;
        border-top: 1px solid transparent;
        border-right: 1px solid transparent;
        border-left: 1px solid transparent;
        color: var(--on-surface-muted);
        background: transparent;
      }
      .options-tabs button:hover {
        color: var(--ink);
        background: var(--surface-highest);
      }
      .options-tabs button[aria-selected='true'] {
        border-color: var(--ink);
        color: var(--surface);
        background: var(--ink);
      }
      .options-tabs button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: -4px;
      }
      .tab-panel {
        padding: 24px;
        border: 1px solid var(--ghost);
        background: var(--surface);
      }
      .tab-panel[hidden] {
        display: none;
      }
      .section-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 16px;
      }
      .section-heading h2 {
        margin-bottom: 6px;
      }
      .settings-list {
        border-top: 1px solid var(--ghost);
      }
      .settings-group {
        display: grid;
        grid-template-columns: minmax(150px, 0.35fr) minmax(0, 1fr);
        gap: 24px;
        padding: 20px 0;
        border-bottom: 1px solid var(--ghost);
      }
      .settings-group .field {
        min-width: 0;
      }
      .provider-form {
        background: var(--surface);
        border: 1px solid var(--ink);
        padding: 20px;
        margin-top: 16px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .provider-form .field {
        display: flex;
        flex-direction: column;
      }
      .provider-form .field.full {
        grid-column: 1 / -1;
      }
      .provider-form label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--on-surface-muted);
        margin-bottom: 6px;
      }
      .provider-form input,
      .provider-form select {
        padding: 8px 10px;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: var(--surface);
        color: var(--on-surface);
        font-family: var(--font-data);
        font-size: 13px;
      }
      .provider-form input:focus,
      .provider-form select:focus {
        outline: none;
        border-width: 2px;
        padding: 7px 9px;
      }
      .form-actions {
        grid-column: 1 / -1;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .form-error {
        grid-column: 1 / -1;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
      }
      .form-error--stacked {
        margin-bottom: 12px;
      }
      .active-cell {
        text-align: center;
        width: 70px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border: 1px solid var(--ink);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: var(--ink);
        color: var(--surface);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }

      .highlight-color-control {
        min-width: 0;
      }

      .highlight-color-control label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--on-surface-muted);
        margin-bottom: 10px;
      }

      .highlight-color-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .highlight-color-row input[type='color'] {
        width: 44px;
        height: 34px;
        padding: 0;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: var(--surface);
        cursor: pointer;
      }

      .highlight-color-swatch {
        display: inline-block;
        width: 96px;
        height: 28px;
        border: 1px solid var(--ghost);
        background: var(--pagetollm-highlight-color);
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }
      .theme-toggle {
        display: inline-flex;
        border: 1px solid var(--ink);
      }
      .theme-toggle .theme-option {
        border: none;
        border-left: 1px solid var(--ink);
        background: var(--surface);
        color: var(--on-surface);
      }
      .theme-toggle .theme-option:first-child {
        border-left: none;
      }
      .theme-toggle .theme-option:hover {
        background: var(--surface-highest);
        color: var(--ink);
      }
      .theme-toggle .theme-option.active,
      .theme-toggle .theme-option.active:hover {
        background: var(--ink);
        color: var(--surface);
      }

      @media (max-width: 700px) {
        body {
          padding: 20px 16px;
        }
        .tab-panel {
          padding: 18px 16px;
        }
        .settings-group {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        .section-heading,
        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }
        .provider-form {
          grid-template-columns: 1fr;
        }
        .data-actions {
          grid-template-columns: 1fr;
        }
        .provider-form .field.full {
          grid-column: auto;
        }
        table {
          display: block;
          overflow-x: auto;
        }
      }

      /* Clickable `error` status chip in the records table. */
      .status-button {
        cursor: pointer;
        font-family: inherit;
      }
      .status.error.status-button:hover {
        background: var(--ink);
        color: var(--surface);
        border-color: var(--ink);
      }

      /* Record error dialog (mirrors the canvas "Processing Failed" overlay,
         but page-level fixed rather than iframe-absolute). */
      .pagetollm-options-error-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgb(0 0 0 / 45%);
        z-index: 100;
      }
      .pagetollm-spinner-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 28px 32px;
        background: var(--surface);
        border: 2px solid var(--ink);
        min-width: 280px;
        max-width: 560px;
        text-align: center;
      }
      .pagetollm-spinner-error-title {
        color: var(--accent);
        font-family: var(--font-voice);
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      .pagetollm-options-error-source {
        font-size: 12px;
        color: var(--on-surface-muted);
        word-break: break-all;
      }
      .pagetollm-spinner-error-body {
        width: 100%;
        color: var(--on-surface);
        font-size: 13px;
      }
      .pagetollm-spinner-error-msg {
        margin-bottom: 8px;
        word-break: break-word;
      }
      .pagetollm-spinner-error-details {
        margin-top: 8px;
        text-align: left;
      }
      .pagetollm-spinner-error-details summary {
        cursor: pointer;
        font-size: 12px;
        color: var(--on-surface-muted);
        text-transform: none;
        letter-spacing: normal;
      }
      .pagetollm-spinner-error-details pre {
        margin-top: 6px;
        padding: 8px;
        background: var(--surface-low);
        border: 1px solid var(--ghost);
        max-height: 200px;
        overflow: auto;
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        color: var(--ink);
      }
      .pagetollm-spinner-actions {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .pagetollm-spinner-retry-btn {
        background: var(--ink);
        color: var(--surface);
        border: 2px solid var(--ink);
      }
      .pagetollm-spinner-retry-btn:hover:not(:disabled) {
        background: var(--surface);
        color: var(--ink);
      }
      .pagetollm-spinner-retry-btn:disabled,
      .pagetollm-spinner-close-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="options-root"></div>
    <script src="options.js"></script>
  </body>
</html>
