<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PageToLLM Canvas - Options</title>
  <style>
    :root {
      --ink: #000000;
      --accent: #7e0000;
      --surface: #ffffff;
      --surface-low: #f3f1ea;
      --surface-highest: #e7e3d8;
      --on-surface: #141414;
      --on-surface-muted: #5a574e;
      --ghost: rgba(0, 0, 0, 0.2);
      --font-voice: "Newsreader", Georgia, "Times New Roman", serif;
      --font-data: "Work Sans", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      font-family: var(--font-data);
      margin: 0;
      padding: 32px;
      background: var(--surface-low);
      color: var(--on-surface);
    }
    h1 {
      font-family: var(--font-voice);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin: 0 0 20px 0;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    button {
      padding: 7px 14px;
      border: 1px solid var(--ink);
      border-radius: 0;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    button:hover { background: var(--ink); color: var(--surface); }
    button.danger { background: var(--surface); color: var(--accent); border-color: var(--accent); }
    button.danger:hover { background: var(--accent); color: var(--surface); }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 2px solid var(--ink); }
    th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--ghost); font-size: 13px; vertical-align: top; }
    th {
      background: var(--surface-highest);
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-bottom: 2px solid var(--ink);
    }
    tr:last-child td { border-bottom: none; }
    .url { max-width: 480px; word-break: break-all; }
    .status {
      display: inline-block;
      padding: 2px 8px;
      border: 1px solid var(--ink);
      border-radius: 0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: var(--surface);
      color: var(--on-surface-muted);
    }
    .status.done { background: var(--ink); color: var(--surface); }
    .status.error { background: var(--accent); color: var(--surface); border-color: var(--accent); }
    .status.pending, .status.splitting, .status.summarizing { background: var(--surface); color: var(--on-surface-muted); border-color: var(--ghost); }
    .empty { color: var(--on-surface-muted); font-style: italic; padding: 16px; text-align: center; }
    .note { font-size: 11px; color: var(--on-surface-muted); margin-top: 4px; }
  </style>
</head>
<body>
  <div id="options-root"></div>
  <script src="options.js"></script>
</body>
</html>
