<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>PageToLLM Canvas - Options</title>
    <style>
      :root {
        --ink: #000000;
        --accent: #3a404d;
        --surface: #ffffff;
        --surface-low: #f2f3f5;
        --surface-highest: #e4e7eb;
        --on-surface: #141414;
        --on-surface-muted: #5f646b;
        --ghost: rgba(0, 0, 0, 0.2);
        --font-voice: 'Newsreader', Georgia, 'Times New Roman', serif;
        --font-data: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        font-family: var(--font-data);
        margin: 0;
        padding: 32px;
        background: var(--surface-low);
        color: var(--on-surface);
      }
      h1 {
        font-family: var(--font-voice);
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.05;
        margin: 0 0 20px 0;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      button {
        padding: 7px 14px;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      button:hover {
        background: var(--ink);
        color: var(--surface);
      }
      button.danger {
        background: var(--surface);
        color: var(--accent);
        border-color: var(--accent);
      }
      button.danger:hover {
        background: var(--accent);
        color: var(--surface);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border: 2px solid var(--ink);
      }
      th,
      td {
        padding: 11px 14px;
        text-align: left;
        border-bottom: 1px solid var(--ghost);
        font-size: 13px;
        vertical-align: top;
      }
      th {
        background: var(--surface-highest);
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border-bottom: 2px solid var(--ink);
      }
      tr:last-child td {
        border-bottom: none;
      }
      .url {
        max-width: 480px;
        word-break: break-all;
      }
      .record-url {
        word-break: break-all;
      }
      .record-snippet {
        margin-top: 6px;
        color: var(--on-surface-muted);
        font-size: 12px;
        line-height: 1.4;
        word-break: break-word;
      }
      .status {
        display: inline-block;
        padding: 2px 8px;
        border: 1px solid var(--ink);
        border-radius: 0;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: var(--surface);
        color: var(--on-surface-muted);
      }
      .status.done {
        background: var(--ink);
        color: var(--surface);
      }
      .status.error {
        background: var(--accent);
        color: var(--surface);
        border-color: var(--accent);
      }
      .status.pending,
      .status.splitting,
      .status.summarizing {
        background: var(--surface);
        color: var(--on-surface-muted);
        border-color: var(--ghost);
      }
      .empty {
        color: var(--on-surface-muted);
        font-style: italic;
        padding: 16px;
        text-align: center;
      }
      .note {
        font-size: 11px;
        color: var(--on-surface-muted);
        margin-top: 4px;
      }

      /* LLM Providers */
      .section {
        margin-bottom: 40px;
      }
      h2 {
        font-family: var(--font-voice);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 14px 0;
      }
      .provider-form {
        background: var(--surface);
        border: 1px solid var(--ink);
        padding: 20px;
        margin-top: 16px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .provider-form .field {
        display: flex;
        flex-direction: column;
      }
      .provider-form .field.full {
        grid-column: 1 / -1;
      }
      .provider-form label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--on-surface-muted);
        margin-bottom: 6px;
      }
      .provider-form input,
      .provider-form select {
        padding: 8px 10px;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: var(--surface);
        color: var(--on-surface);
        font-family: var(--font-data);
        font-size: 13px;
      }
      .provider-form input:focus,
      .provider-form select:focus {
        outline: none;
        border-width: 2px;
        padding: 7px 9px;
      }
      .form-actions {
        grid-column: 1 / -1;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .form-error {
        grid-column: 1 / -1;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
      }
      .active-cell {
        text-align: center;
        width: 70px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border: 1px solid var(--ink);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: var(--ink);
        color: var(--surface);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="options-root"></div>
    <script src="options.js"></script>
  </body>
</html>
