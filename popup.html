<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PageToLLM Canvas</title>
  <style>
    body {
      width: 260px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 15px;
      color: #1f2937;
    }
    button {
      width: 100%;
      padding: 10px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      background: #2563eb;
      color: #fff;
    }
    button:hover { background: #1d4ed8; }
    .row {
      margin-top: 10px;
      text-align: center;
      font-size: 12px;
    }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h3>PageToLLM Canvas</h3>
  <button id="pick-btn" type="button">Pick Blocks</button>
  <div class="row"><a href="#" id="open-options">Open Options</a></div>
  <script src="popup.js"></script>
</body>
</html>
