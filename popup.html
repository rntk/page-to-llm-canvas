<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>PageToLLM Canvas</title>
    <link rel="stylesheet" href="summary-errors.css" />
    <style>
      :root {
        color-scheme: light;
        --ink: #000000;
        --accent: #3a404d;
        --surface: #ffffff;
        --surface-low: #f2f3f5;
        --surface-highest: #e4e7eb;
        --on-surface: #141414;
        --on-surface-muted: #5f646b;
        --ghost: rgba(0, 0, 0, 0.2);
        --font-voice: 'Newsreader', Georgia, 'Times New Roman', serif;
        --font-data: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-family: var(--font-data);
      }

      /* Dark palette. Applied when `data-theme="dark"` is set, or when no
         explicit preference is set ("system") and the OS prefers dark. */
      :root[data-theme='dark'] {
        color-scheme: dark;
        --ink: #f4f5f7;
        --accent: #aab2c0;
        --surface: #1b1d22;
        --surface-low: #141519;
        --surface-highest: #24272e;
        --on-surface: #ececec;
        --on-surface-muted: #a0a6af;
        --ghost: rgba(255, 255, 255, 0.22);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']):not([data-theme='dark']) {
          color-scheme: dark;
          --ink: #f4f5f7;
          --accent: #aab2c0;
          --surface: #1b1d22;
          --surface-low: #141519;
          --surface-highest: #24272e;
          --on-surface: #ececec;
          --on-surface-muted: #a0a6af;
          --ghost: rgba(255, 255, 255, 0.22);
        }
      }

      body {
        width: 420px;
        margin: 0;
        color: var(--on-surface);
        background: var(--surface-low);
      }

      .shell {
        display: flex;
        flex-direction: column;
        min-height: 220px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 14px 12px;
        background: var(--surface-highest);
        border-bottom: 2px solid var(--ink);
      }

      h1 {
        margin: 0;
        font-family: var(--font-voice);
        font-size: 20px;
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .host {
        margin-top: 4px;
        max-width: 270px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--on-surface-muted);
        font-size: 12px;
      }

      .header-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }

      .icon-btn {
        width: 30px;
        height: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 0;
        color: var(--ink);
        background: var(--surface);
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
      }

      .icon-btn:hover {
        background: var(--ink);
        color: var(--surface);
      }

      .primary {
        margin: 14px 14px 12px;
        padding: 11px 12px;
        cursor: pointer;
        border: 2px solid var(--ink);
        border-radius: 0;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: var(--ink);
        color: var(--surface);
      }

      .primary:hover {
        background: var(--surface);
        color: var(--ink);
      }

      .control-hint {
        margin: -4px 14px 12px;
        color: var(--on-surface-muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .primary:disabled,
      .primary:disabled:hover {
        cursor: not-allowed;
        border-color: var(--ghost);
        background: var(--surface-highest);
        color: var(--on-surface-muted);
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px 7px;
        color: var(--on-surface-muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .records {
        list-style: none;
        margin: 0;
        padding: 0 8px 10px;
        max-height: 340px;
        overflow: auto;
      }

      .record {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        padding: 10px 6px;
        border-top: 1px solid var(--ghost);
      }

      .record:first-child {
        border-top: none;
      }

      .label {
        min-width: 0;
        font-family: var(--font-voice);
        font-size: 15px;
        line-height: 1.2;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .meta {
        margin-top: 4px;
        color: var(--on-surface-muted);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .snippet {
        margin-top: 5px;
        color: var(--on-surface-muted);
        font-size: 12px;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
      }

      .badge {
        align-self: start;
        padding: 3px 6px;
        border: 1px solid var(--ink);
        border-radius: 0;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
        background: var(--surface);
        color: var(--ink);
      }

      .badge.done {
        background: var(--ink);
        color: var(--surface);
      }

      .badge.pending,
      .badge.splitting,
      .badge.summarizing {
        background: var(--surface);
        color: var(--on-surface-muted);
        border-color: var(--ghost);
      }

      .badge.error {
        background: var(--accent);
        color: var(--surface);
        border-color: var(--accent);
      }

      .badge.needs_attention {
        background: var(--accent);
        color: var(--surface);
        border-color: var(--accent);
      }

      .badge.status-button {
        cursor: pointer;
        font-family: inherit;
      }

      .badge.status-button:hover {
        background: var(--ink);
        color: var(--surface);
        border-color: var(--ink);
      }

      .pagetollm-popup-summary-errors-dialog {
        --pagetollm-summary-errors-list-width: 100%;
        --pagetollm-summary-errors-list-max-height: 140px;
        --pagetollm-summary-errors-list-margin: 0;

        position: fixed;
        inset: 0;
        width: auto;
        max-width: none;
        height: auto;
        max-height: none;
        margin: auto;
        padding: 0;
        overflow: visible;
        color: inherit;
        border: 0;
        background: transparent;
      }

      .pagetollm-popup-summary-errors-dialog::backdrop {
        background: rgb(0 0 0 / 45%);
      }

      .pagetollm-spinner-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: min(350px, calc(100vw - 28px));
        max-height: calc(100vh - 28px);
        overflow: auto;
        box-sizing: border-box;
        padding: 22px;
        background: var(--surface);
        border: 2px solid var(--ink);
        text-align: center;
      }

      .pagetollm-spinner-error-title {
        color: var(--accent);
        font-family: var(--font-voice);
        font-size: 19px;
        font-weight: 800;
      }

      .pagetollm-spinner-error-body {
        color: var(--on-surface);
        font-size: 12px;
        line-height: 1.4;
      }

      .pagetollm-spinner-actions {
        display: flex;
        gap: 8px;
        justify-content: center;
      }

      .pagetollm-spinner-actions button {
        padding: 7px 12px;
        border: 1px solid var(--ink);
        background: var(--surface);
        color: var(--ink);
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .pagetollm-spinner-actions .pagetollm-spinner-retry-btn {
        border-width: 2px;
        background: var(--ink);
        color: var(--surface);
      }

      .pagetollm-spinner-actions button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      .actions {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 4px;
      }

      /* Two equal-width buttons per row. */
      .action-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      /* Reprocess/Delete mutate or destroy the record rather than opening a
         view, so set them apart from the view actions with a divider above. */
      .action-group.manage {
        padding-top: 8px;
        border-top: 1.5px solid var(--ghost);
      }

      .action {
        border: 1.5px solid var(--ink);
        border-radius: 0;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 8px 12px;
        line-height: 1;
        transition:
          background 0.12s ease,
          color 0.12s ease;
      }

      /* First view action ("Canvas") is the default open target — give it a
         filled treatment so the record has a clear primary action, echoing the
         "Pick Blocks" button at a smaller scale. */
      .action.primary-action {
        background: var(--ink);
        color: var(--surface);
      }

      .action:hover {
        background: var(--ink);
        color: var(--surface);
      }

      .action.primary-action:hover {
        background: var(--surface);
        color: var(--ink);
      }

      .action.danger {
        border-color: var(--accent);
        color: var(--accent);
      }

      .action.danger:hover {
        background: var(--accent);
        color: var(--surface);
      }

      .action.warning {
        border-color: var(--on-surface-muted);
        color: var(--on-surface-muted);
      }

      .action.warning:hover {
        background: var(--on-surface-muted);
        color: var(--surface);
      }

      .empty,
      .error {
        margin: 2px 14px 14px;
        padding: 18px 12px;
        border: 1px solid var(--ghost);
        border-radius: 0;
        color: var(--on-surface-muted);
        text-align: center;
        font-size: 13px;
        line-height: 1.35;
        background: var(--surface);
      }

      .error {
        border-color: var(--accent);
        color: var(--accent);
      }

      .footer {
        margin-top: auto;
        padding: 11px 14px 14px;
        text-align: center;
        font-size: 12px;
        border-top: 1px solid var(--ink);
        background: var(--surface-highest);
      }

      a {
        color: var(--ink);
        font-weight: 700;
        text-decoration: none;
        border-bottom: 1px solid var(--ink);
      }

      a:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      .footer-hint {
        margin-top: 6px;
        color: var(--on-surface-muted);
        font-size: 11px;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <h1>PageToLLM Canvas</h1>
          <div class="host" id="active-host">Loading page...</div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="theme-btn" type="button" title="Theme" aria-label="Theme">
            ◐
          </button>
          <button
            class="icon-btn"
            id="refresh-btn"
            type="button"
            title="Reload saved analyses for the current page."
            aria-label="Reload saved analyses for the current page"
          >
            ↻
          </button>
        </div>
      </header>

      <button
        class="primary"
        id="pick-btn"
        type="button"
        title="Select blocks on this page and send them to your active LLM provider for analysis."
        aria-describedby="pick-hint"
      >
        Pick Blocks
      </button>
      <div class="control-hint" id="pick-hint">
        Select page sections to analyze and save as a canvas.
      </div>

      <div class="section-title">
        <span>Saved analyses</span>
        <span id="record-count"></span>
      </div>
      <ul class="records" id="records"></ul>
      <div class="empty" id="empty" hidden>No saved analyses for this page yet.</div>
      <div class="error" id="error" hidden></div>

      <footer class="footer">
        <a
          href="#"
          id="open-options"
          title="Configure LLM providers and extension settings."
          aria-describedby="options-hint"
        >
          Open Options
        </a>
        <div class="footer-hint" id="options-hint">Configure providers and extension settings.</div>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
